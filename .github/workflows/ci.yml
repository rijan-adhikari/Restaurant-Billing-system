name: Royal Skye POS CI

on:
  push:
    branches:
      - main
      - feature/restaurant-management-suite
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend and run billing tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend production assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend Docker image
        run: docker build -t royal-skye-pos-backend ./backend

      - name: Build frontend production Docker image
        run: docker build -t royal-skye-pos-frontend ./frontend
