name: Royal Skye POS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: royal-skye-pos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend and run billing tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend production assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend Docker image
        run: docker build -t royal-skye-pos-backend ./backend

      - name: Build frontend production Docker image
        run: docker build -t royal-skye-pos-frontend ./frontend

      - name: Start full production Compose stack
        run: docker compose up -d --build

      - name: Smoke-test frontend and proxied API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/api/health > /tmp/royal-skye-health.json; then
              cat /tmp/royal-skye-health.json
              curl -fsS http://localhost:5173/ > /dev/null
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
