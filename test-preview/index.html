<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Skye · Interactive POS Preview</title>
<style>
:root{--ink:#211d1b;--muted:#817872;--paper:#f6f4f1;--card:#fff;--line:#e9e4df;--red:#b83a32;--green:#287653;--gold:#b78a54}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{background:#211e1d;color:#f7f3ef;padding:24px 16px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:3px 8px 26px}.mark{width:37px;height:37px;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:#211d1b;font-weight:900}.brand b{display:block;font-size:14px;letter-spacing:.08em}.brand small{color:#bdb4ae;font-size:10px;letter-spacing:.15em}.group{color:#968b84;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:13px 10px 7px}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:9px;background:transparent;color:#d5cec8;text-align:left;font:inherit;font-size:12px;cursor:pointer;margin:2px 0}.nav:hover{background:#302a27}.nav.active{background:#39312e;color:white}.nav .ico{width:17px;text-align:center;color:#c6a77e}.sidefoot{margin-top:auto;color:#a99f98;font-size:10px;padding:14px 9px;border-top:1px solid #403936}.main{padding:28px 34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.top h1{font-size:25px;margin:4px 0 0;letter-spacing:-.04em}.user{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;background:#e8d9ca;display:grid;place-items:center;font-weight:700}.user small{display:block;color:var(--muted);font-size:11px}.pill{border:1px solid #e8d8c5;border-radius:30px;padding:6px 10px;color:#87623e;font-size:9px;letter-spacing:.08em}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px}.statlabel{color:var(--muted);font-size:11px}.statvalue{font-size:24px;font-weight:700;letter-spacing:-.04em;margin:8px 0 3px}.delta{font-size:10px;color:var(--green)}.muted{color:var(--muted)}.negative{color:var(--red)!important;font-weight:650}.positive{color:var(--green);font-weight:650}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.sectionhead h2{font-size:16px;margin:0}.sectionhead span{font-size:10px;color:var(--muted)}.lower{display:grid;grid-template-columns:1.5fr 1fr;gap:13px}.table{width:100%;border-collapse:collapse;margin-top:8px}.table th{text-align:left;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid #f0ece8;font-size:11px}.table tr:last-child td{border:0}.status{display:inline-block;border-radius:30px;padding:4px 8px;background:#eaf4ee;color:var(--green);font-size:9px}.pending{background:#f8f0e4;color:#986b2e}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff;text-align:left;cursor:pointer}.action:hover{border-color:#c9ad8e;background:#fdfbf8}.action b{display:block;font-size:11px;margin-bottom:3px}.action small{color:var(--muted);font-size:10px}.note{margin-top:16px;border:1px dashed #d8c9b8;border-radius:10px;padding:11px 13px;color:#75675d;font-size:10px;background:#fbf8f4}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:white;color:var(--ink);font:inherit;font-size:11px;cursor:pointer}.btn.primary{background:#282321;color:white;border-color:#282321}.btn:hover{filter:brightness(.96)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:10px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:white;font:inherit;font-size:12px}.itemrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f0ece8;font-size:12px}.itemrow:last-child{border:0}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.tag{font-size:9px;background:#f2eee9;color:#75675d;padding:4px 7px;border-radius:20px}.pageintro{color:var(--muted);font-size:12px;margin:-4px 0 18px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:13px;display:block}.brand{padding-bottom:10px}.group,.sidefoot{display:none}.navwrap{display:flex;overflow-x:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:8px 10px}.main{padding:21px 15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lower,.grid2{grid-template-columns:1fr}}@media(max-width:480px){.top{align-items:flex-start}.top h1{font-size:21px}.pill{display:none}.stats{gap:8px}.card{padding:13px}.statvalue{font-size:20px}.grid3{grid-template-columns:1fr}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style></head><body><div class="shell">
<aside class="side"><div class="brand"><div class="mark">RS</div><div><b>ROYAL SKYE</b><small>RESTAURANT & BAR</small></div></div>
<div class="group">Workspace</div><div class="navwrap">
<button class="nav active" data-page="Dashboard"><span class="ico">▦</span>Dashboard</button><button class="nav" data-page="Billing"><span class="ico">▤</span>Billing & Orders</button><button class="nav" data-page="Menu"><span class="ico">♧</span>Menu & Categories</button><button class="nav" data-page="Tables"><span class="ico">⌂</span>Tables & Reservations</button><button class="nav" data-page="Kitchen"><span class="ico">♨</span>Kitchen</button></div>
<div class="group">Management</div><div class="navwrap"><button class="nav" data-page="Inventory"><span class="ico">▣</span>Inventory & Stock</button><button class="nav" data-page="Expenses"><span class="ico">↗</span>Expenses</button><button class="nav" data-page="Cash Drawer"><span class="ico">◷</span>Cash Drawer</button><button class="nav" data-page="Payroll"><span class="ico">♙</span>Payroll</button></div>
<div class="group">Administration</div><div class="navwrap"><button class="nav" data-page="Administration"><span class="ico">⚙</span>Staff & Permissions</button><button class="nav" data-page="Reports"><span class="ico">☷</span>Reports & Activity</button></div>
<div class="sidefoot">Interactive preview · Sample data only</div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">ROYAL SKYE / <span id="crumb">OVERVIEW</span></div><h1 id="heading">Good afternoon, Manager</h1></div><div class="user"><span class="pill">INTERACTIVE DEMO</span><div class="avatar">M</div><div><b>Manager</b><small>Demo role</small></div></div></header><div id="content"></div></main></div>
<script>
const sampleOrders=[["#RS-1042","Table 04","QR payment","Paid","3,450"],["#RS-1041","Takeaway","Cash","Paid","1,250"],["#RS-1040","Table 02","Partial","Balance due","2,800"],["#RS-1039","Table 07","QR payment","Paid","4,100"]];
const pages={
"Dashboard":()=>`<section class="stats"><div class="card"><div class="statlabel">Today's sales</div><div class="statvalue">NPR 48,250</div><div class="delta">↑ 8.4% vs previous day</div></div><div class="card"><div class="statlabel">Orders completed</div><div class="statvalue">36</div><div class="delta">↑ 5 orders today</div></div><div class="card"><div class="statlabel">Operating expenses</div><div class="statvalue negative">NPR 6,800</div><div class="muted" style="font-size:10px">Recorded today</div></div><div class="card"><div class="statlabel">Estimated net</div><div class="statvalue">NPR 41,450</div><div class="delta">Positive operating balance</div></div></section><div class="sectionhead"><h2>Recent transactions</h2><span>Fictional sample records</span></div><section class="lower"><div class="card">${orderTable()}</div><div class="card"><div class="sectionhead" style="margin:0 0 12px"><h2>Quick actions</h2></div><div class="quick">${action("＋ New bill","Create an order","Billing")}${action("▤ Add expense","Record a cost","Expenses")}${action("◷ Cash drawer","Review shift totals","Cash Drawer")}${action("♙ Payroll","Salary and cashouts","Payroll")}</div><div class="note"><b>Safe preview:</b> No login, payment processing, API, or production data connection.</div></div></section>`,
"Billing":()=>`<p class="pageintro">Explore the sample billing screen. Actions are simulated and do not create real bills.</p><div class="grid2"><div class="card"><h2 style="font-size:14px;margin:0">Create demo bill</h2><div class="field"><label>Order type</label><select><option>Dine-in · Table 04</option><option>Takeaway</option><option>Delivery</option></select></div><div class="field"><label>Sample item</label><select id="billItem"><option value="850">Chicken momo · NPR 850</option><option value="550">Veg chowmein · NPR 550</option><option value="1200">Paneer tikka · NPR 1,200</option></select></div><div class="field"><label>Discount (%)</label><input id="discount" type="number" min="0" max="100" value="5"></div><div class="field"><label>Payment method</label><select><option>QR payment</option><option>Cash</option><option>Card</option></select></div><div class="itemrow"><b>Demo total after discount</b><b id="billTotal">NPR 807.50</b></div><button class="btn primary" onclick="demoAlert('Demo only — no bill was saved.')">Preview bill</button></div><div class="card"><h2 style="font-size:14px;margin:0 0 8px">Recent bills</h2>${orderTable()}</div></div>`,
"Menu":()=>listPage("Menu & Categories","Sample menu catalogue",["Chicken momo · NPR 850","Veg chowmein · NPR 550","Paneer tikka · NPR 1,200","Masala tea · NPR 120","Club sandwich · NPR 650"]),
"Tables":()=>`<p class="pageintro">Sample floor status. Select a table to see its demo state.</p><div class="grid3">${["Table 01 · Available","Table 02 · Occupied","Table 03 · Available","Table 04 · Occupied","Table 05 · Reserved","Table 06 · Available"].map((x,i)=>`<button class="card action" onclick="demoAlert('${x} — sample table only')"><b>${x.split(" · ")[0]}</b><small>${x.split(" · ")[1]}</small></button>`).join("")}</div>`,
"Kitchen":()=>listPage("Kitchen queue","Illustrative KOT tickets",["KOT #208 · Chicken momo · Preparing","KOT #207 · Paneer tikka · Ready","KOT #206 · Chowmein · Preparing"]),
"Inventory":()=>listPage("Inventory & Stock","Example stock levels",["Chicken · 12 kg · In stock","Flour · 8 kg · In stock","Cooking oil · 2 L · Low stock","Soft drinks · 18 units · In stock"]),
"Expenses":()=>`<p class="pageintro">Sample expense ledger. Add expense is a non-persistent demo interaction.</p><div class="stats"><div class="card"><div class="statlabel">Today's expenses</div><div class="statvalue negative">NPR 6,800</div></div><div class="card"><div class="statlabel">This month</div><div class="statvalue">NPR 82,400</div></div></div><div class="sectionhead"><h2>Expense entries</h2><button class="btn primary" onclick="demoAlert('Expense form is a prototype. No record saved.')">＋ Add expense</button></div><div class="card">${listRows(["Vegetables · NPR 2,400","Dairy products · NPR 1,800","Cleaning supplies · NPR 1,100","Gas refill · NPR 1,500"])}</div>`,
"Cash Drawer":()=>`<p class="pageintro">Sample shift and drawer figures, isolated from live cash records.</p><div class="grid2"><div class="card"><div class="statlabel">Opening balance</div><div class="statvalue">NPR 5,000</div></div><div class="card"><div class="statlabel">Expected closing</div><div class="statvalue">NPR 18,450</div></div></div><div class="sectionhead"><h2>Drawer activity</h2><span>Demo shift · 08:00–16:00</span></div><div class="card">${listRows(["Cash sales · + NPR 12,450","Cash expense · − NPR 1,500","Cash refund · − NPR 500"])}</div>`,
"Payroll":()=>`<p class="pageintro">Illustrative payroll, salary cashouts and remaining balances.</p><div class="card"><table class="table"><thead><tr><th>Staff member</th><th>Monthly salary</th><th>Cashout</th><th>Remaining</th></tr></thead><tbody><tr><td>Sample Staff A</td><td>25,000</td><td>10,000</td><td>15,000</td></tr><tr><td>Sample Staff B</td><td>22,000</td><td>5,000</td><td>17,000</td></tr><tr><td>Sample Staff C</td><td>20,000</td><td>0</td><td>20,000</td></tr></tbody></table><button class="btn primary" onclick="demoAlert('Payroll cashout is a prototype. No salary record changed.')">＋ Demo cashout</button></div>`,
"Administration":()=>`<p class="pageintro">Illustrative role permissions. This is not connected to application authentication.</p><div class="grid3"><div class="card"><b>Administrator</b><p class="muted">Full system access, staff accounts, master controls and settings.</p><span class="tag">Full access</span></div><div class="card"><b>Manager</b><p class="muted">Daily operations, expenses, inventory and authorized payroll.</p><span class="tag">Restricted admin</span></div><div class="card"><b>Staff</b><p class="muted">Assigned operational modules only.</p><span class="tag">Limited access</span></div></div><div class="note">Actual permissions must be enforced and tested by the backend before production release.</div>`,
"Reports":()=>`<p class="pageintro">Sample reporting overview. All values are fictional.</p><div class="stats"><div class="card"><div class="statlabel">Gross sales</div><div class="statvalue">NPR 48,250</div></div><div class="card"><div class="statlabel">Expenses</div><div class="statvalue negative">NPR 6,800</div></div><div class="card"><div class="statlabel">Net estimate</div><div class="statvalue">NPR 41,450</div></div><div class="card"><div class="statlabel">Unpaid balance</div><div class="statvalue">NPR 2,800</div></div></div><div class="sectionhead"><h2>Activity log</h2></div><div class="card">${listRows(["14:32 · Sample bill #RS-1042 marked paid","14:15 · Sample expense recorded","13:58 · Demo shift opened","13:40 · Sample staff login"])}</div>`
};
function orderTable(){return `<table class="table"><thead><tr><th>Order</th><th>Payment</th><th>Status</th><th style="text-align:right">Total</th></tr></thead><tbody>${sampleOrders.map(o=>`<tr><td><b>${o[0]}</b><br><span class="muted">${o[1]}</span></td><td>${o[2]}</td><td><span class="status ${o[3]==="Paid"?"":"pending"}">${o[3]}</span></td><td style="text-align:right">${o[4]}</td></tr>`).join("")}</tbody></table>`}
function action(title,desc,page){return `<button class="action" onclick="showPage('${page}')"><b>${title}</b><small>${desc}</small></button>`}
function listRows(items){return items.map(x=>`<div class="itemrow"><span>${x.split(" · ")[0]}</span><b>${x.split(" · ")[1]||""}</b></div>`).join("")}
function listPage(title,desc,items){return `<p class="pageintro">${desc} · Demo data only</p><div class="card"><div class="sectionhead" style="margin-top:0"><h2>${title}</h2><span>${items.length} sample entries</span></div>${listRows(items)}</div>`}
function showPage(page){document.getElementById("content").innerHTML=pages[page]();document.getElementById("heading").textContent=page==="Dashboard"?"Good afternoon, Manager":page;document.getElementById("crumb").textContent=page.toUpperCase();document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="Billing"){const recalc=()=>{const v=Number(document.getElementById("billItem").value),d=Math.min(100,Math.max(0,Number(document.getElementById("discount").value)||0));document.getElementById("billTotal").textContent="NPR "+(v*(1-d/100)).toFixed(2)};document.getElementById("billItem").addEventListener("change",recalc);document.getElementById("discount").addEventListener("input",recalc)}}
function demoAlert(msg){alert(msg)}document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));showPage("Dashboard");
</script></body></html>
